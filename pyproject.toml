[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vizzer"
version = "0.7.1" # Routed-view scrolling and reliable constellation pointer selection.
description = "Portable work-graph views: normalize a project's specs/ledgers/docs into one graph and render roadmap, dashboard, and a 3D constellation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
vizzer = "vizzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vizzer.render" = ["constellation/*.html", "constellation/*.css", "constellation/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
