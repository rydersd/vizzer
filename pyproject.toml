[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vizzer"
version = "0.8.36" # Keep the semantic-center exception from stealing front-painted endpoints.
description = "Portable work-graph views: normalize a project's specs/ledgers/docs into one graph and render roadmap, dashboard, and a 3D constellation."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
vizzer = "vizzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vizzer.render" = [
  "constellation/*.html",
  "constellation/*.css",
  "constellation/*.js",
  "constellation/third-party/*",
  "developer_flow_assets/*",
  "developer_flow_assets/third-party/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
