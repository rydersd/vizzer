<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample service status</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#172033;font:18px/1.5 system-ui,sans-serif}
main{width:min(560px,calc(100vw - 48px));padding:32px;border:1px solid #cbd5e1;border-radius:16px;background:white;box-shadow:0 16px 40px #1e293b18}
.state{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:700}
.state::before{content:"";width:10px;height:10px;border-radius:50%;background:#22c55e}
p{color:#475569}
</style>
<main>
  <div class="state" role="status">All systems ready</div>
  <h1>Sample service</h1>
  <p>The current service state is visible in this project-neutral browser fixture.</p>
</main>
</html>
