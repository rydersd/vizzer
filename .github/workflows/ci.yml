name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/developer-flow/package-lock.json
      - run: pip install pytest
      - name: Install developer-flow test dependencies
        run: npm ci --prefix tools/developer-flow --ignore-scripts
      - name: Configure git identity (fixture commits)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - run: python -m pytest tests/ -v

  pyz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p dist && python scripts/build_pyz.py dist/vizzer.pyz
      - uses: actions/upload-artifact@v4
        with:
          name: vizzer-distributable
          path: dist/vizzer.pyz
