name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/developer-flow/package-lock.json
      - run: pip install pytest
      - name: Install developer-flow test dependencies
        run: npm ci --prefix tools/developer-flow --ignore-scripts
      - name: Verify vendored Milkdown bundle is reproducible
        run: |
          npm ci --prefix tools/markdown-editor --ignore-scripts
          npm run build --prefix tools/markdown-editor
          git diff --exit-code -- src/vizzer/render/constellation/third-party tools/markdown-editor/bundle-inputs.json
      - name: Configure git identity (fixture commits)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - run: python -m pytest tests/ -v

  pyz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: mkdir -p dist && python scripts/build_pyz.py dist/vizzer.pyz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vizzer-distributable
          path: dist/vizzer.pyz
